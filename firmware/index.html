<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhostType</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    background: #16213e;
    border-radius: 12px;
    padding: 24px;
    width: 380px;
    max-width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #888; margin-bottom: 16px; }
  .status {
    font-size: 11px;
    margin-bottom: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    background: #0f3460;
  }
  .status.ok { color: #4ecca3; }
  .status.err { color: #e94560; }
  .status.pending { color: #f5a623; }
  textarea {
    width: 100%;
    height: 80px;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #0f3460;
    color: #eee;
    font-size: 14px;
    resize: vertical;
    margin-bottom: 12px;
  }
  textarea:focus { outline: 1px solid #4ecca3; }
  .send-row { display: flex; gap: 8px; }
  .btn-send {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #4ecca3;
    color: #1a1a2e;
  }
  .btn-send:hover { background: #3dbb91; }
  .shortcuts {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .shortcuts button {
    padding: 6px 4px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #0f3460;
    color: #ccc;
    cursor: pointer;
    font-size: 11px;
  }
  .shortcuts button:hover { background: #1a4a8a; color: #fff; }
  .shortcuts .spacer { background: none; border: none; pointer-events: none; }
  .btn-enter {
    background: #e94560 !important;
    border-color: #e94560 !important;
    color: #fff !important;
  }
  .btn-enter:hover { background: #d63851 !important; }
  .hint { font-size: 11px; color: #555; margin-top: 12px; text-align: center; }
  .btn-history {
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #0f3460;
    color: #888;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-history:hover { color: #4ecca3; border-color: #4ecca3; }
  .btn-history.active { color: #4ecca3; border-color: #4ecca3; }
  .history-panel { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
  .history-panel.open { max-height: 320px; margin-top: 12px; }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .history-header span {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .history-clear {
    font-size: 11px;
    color: #e94560;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .history-clear:hover { text-decoration: underline; }
  .history-list {
    max-height: 260px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
    gap: 12px;
  }
  .history-item:hover { background: #0f3460; }
  .history-item-text {
    font-size: 13px;
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .history-item-time { font-size: 10px; color: #555; white-space: nowrap; flex-shrink: 0; }
  .history-empty { font-size: 12px; color: #555; text-align: center; padding: 16px 0; }
</style>
</head>
<body>

<div class="container">
  <h1>GhostType</h1>
  <div class="subtitle">Wi-Fi Keyboard Remote</div>

  <div id="status" class="status pending">Connecting...</div>

  <textarea id="text" placeholder="Type here, then tap Send..."></textarea>

  <div class="send-row">
    <button class="btn-send" onclick="sendType()">Send</button>
    <button class="btn-history" id="historyBtn" onclick="toggleHistory()" title="Message history">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 4.5V8.5L10.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div id="historyPanel" class="history-panel">
    <div class="history-header">
      <span>Recent messages</span>
      <button class="history-clear" onclick="clearHistory()">Clear all</button>
    </div>
    <div id="historyList" class="history-list"></div>
  </div>

  <div class="shortcuts">
    <button onclick="sendKey('ESCAPE')">Esc</button>
    <div class="spacer"></div>
    <div class="spacer"></div>
    <button class="btn-enter" style="grid-column: span 2;" onclick="sendKey('ENTER')">Enter</button>
    <button onclick="sendKey('TAB')">Tab</button>
    <button onclick="sendCombo(['ALT','TAB'])">Fast Tab</button>
    <div class="spacer"></div>
    <button onclick="sendKey('BACKSPACE')">Bksp</button>
    <button onclick="sendKey('UP_ARROW')">↑</button>
    <button onclick="sendCombo(['CONTROL','A'])">Ctrl+A</button>
    <button onclick="sendCombo(['CONTROL','C'])">Ctrl+C</button>
    <button onclick="sendCombo(['CONTROL','V'])">Ctrl+V</button>
    <button onclick="sendCombo(['CONTROL','ALT','DELETE'])">Alt+Ctrl+Del</button>
    <button onclick="sendKey('DOWN_ARROW')">↓</button>
  </div>

  <div class="hint">Tip: Ctrl+Enter to send</div>
</div>

<script>
// Served by the Pico itself -> same-origin, so plain fetch to relative paths
// works on any browser (no CORS, no file:// sandbox, no host box needed).
const textArea = document.getElementById("text");
const statusEl = document.getElementById("status");

function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = "status " + type;
}

async function checkStatus() {
  setStatus("Connecting...", "pending");
  try {
    const res = await fetch("/status", { signal: AbortSignal.timeout(5000) });
    setStatus("Connected: " + (await res.text()), "ok");
  } catch (e) {
    setStatus("Cannot reach device", "err");
  }
}

async function postCmd(path, payload) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  return await res.text();
}

async function sendType() {
  const text = textArea.value;
  if (!text) return;
  try {
    setStatus(await postCmd("/type", { text: text }), "ok");
    saveToHistory(text);
    textArea.value = "";
    textArea.focus();
  } catch (e) {
    setStatus("Send failed: " + e.message, "err");
  }
}

async function sendKey(key) {
  try { setStatus(await postCmd("/keypress", { key: key }), "ok"); }
  catch (e) { setStatus("Send failed: " + e.message, "err"); }
}

async function sendCombo(keys) {
  try { setStatus(await postCmd("/combo", { keys: keys }), "ok"); }
  catch (e) { setStatus("Send failed: " + e.message, "err"); }
}

textArea.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    sendType();
  }
});

checkStatus();

// --- Message History (localStorage, last 20) ---
const HISTORY_KEY = "ghosttype_history";
const MAX_HISTORY = 20;
const historyPanel = document.getElementById("historyPanel");
const historyList = document.getElementById("historyList");
const historyBtn = document.getElementById("historyBtn");

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch { return []; }
}

function saveToHistory(text) {
  const history = loadHistory();
  const idx = history.findIndex(h => h.text === text);
  if (idx !== -1) history.splice(idx, 1);
  history.unshift({ text, ts: Date.now() });
  if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function relativeTime(ts) {
  const diff = Date.now() - ts;
  const sec = Math.floor(diff / 1000);
  if (sec < 60) return "now";
  const min = Math.floor(sec / 60);
  if (min < 60) return min + "m";
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + "h";
  return Math.floor(hr / 24) + "d";
}

function renderHistory() {
  const history = loadHistory();
  if (!history.length) {
    historyList.innerHTML = '<div class="history-empty">No messages sent yet</div>';
    return;
  }
  historyList.innerHTML = history.map((h, i) =>
    `<div class="history-item" onclick="selectHistory(${i})" title="${h.text.replace(/"/g, '&quot;')}">
      <span class="history-item-text">${h.text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>
      <span class="history-item-time">${relativeTime(h.ts)}</span>
    </div>`
  ).join("");
}

function toggleHistory() {
  const isOpen = historyPanel.classList.toggle("open");
  historyBtn.classList.toggle("active", isOpen);
  if (isOpen) renderHistory();
}

function selectHistory(index) {
  const history = loadHistory();
  if (history[index]) {
    textArea.value = history[index].text;
    textArea.focus();
    historyPanel.classList.remove("open");
    historyBtn.classList.remove("active");
  }
}

function clearHistory() {
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".history-panel") && !e.target.closest(".btn-history")) {
    historyPanel.classList.remove("open");
    historyBtn.classList.remove("active");
  }
});
</script>

</body>
</html>
